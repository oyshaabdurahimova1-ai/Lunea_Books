
name: Build Lunea Books APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q Lunea_Books_Android_Project.zip -d appsrc

      - name: Build APK
        run: gradle --no-daemon -p appsrc assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Lunea_Books_APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
